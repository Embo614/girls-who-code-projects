<!DOCTYPE html>
<html lang="en">

<head>
	<title>Personality Quiz Starter Code</title>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- import the webpage's stylesheet -->
	<link rel="stylesheet" href="/style.css">

	<!-- import the webpage's javascript file -->
	<script src="/script.js" defer>

	</script>
</head>

<body>

	<header>
		<h1>Are you an Acoustic or Electric Guitar Person?</h1>
		<p>Answer these simple questions to see which guitar matches your personality.</p>
	</header>

	<main>

		<h2>Firstly, are you a morning person or a night owl?</h2>
		<div class="question">

			<div class="answer-choice">
				<img src="assets/morning-person.jpeg" alt="A woman doing yoga next to a lake during sunrise.">
        <br>
        <button id="q1a1">Morning Person</button>
      </div>

      <div class="answer-choice">
        <img src="assets/night-owl.jpeg" alt="A silhouette of a cat sitting on a stone wall with tree branches, the moon and the stars in the background.">
        <br>
        <button id="q1a2">Night Owl</button>
      </div>

    </div> 
    
    <h2>Next, what would you rather do during your free time?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/cinema.jpeg" alt="The backs of people at a cinema staring at a white screen.">
        <br>
        <button id="q2a1">Watch a film at the cinema</button>
      </div>

      <div class="answer-choice">
        <img src="assets/cafe.jpeg" alt="A steaming coffee, books and a pair of glasses on a wooden table.">
        <br>
        <button id="q2a2">Read a book at a local café</button>
      </div>

    </div> 
    
    <h2>Finally, Choose a meal...</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/sushi.jpeg" alt="A large bowl consisting of a variety of different types of sushi.">
        <br>
        <button id="q3a1">Sushi</button>
      </div>

      <div class="answer-choice">
        <img src="assets/burger.jpeg" alt="A burger with pickles, tomatoes and lettuce next to a plate of chips.">
        <br>
        <button id="q3a2">Burger</button>
      </div>

    </div> 

    <div>
    <button id="showResult">What kind of person are am I?</button>
      <h2 id="result">You are an...</h2>
    </div>
    <button id="restart">Restart</button>
    
    
  </main>
  </body>
</html>
